<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Де летить • Радар тривог та об'єктів</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-main: #FAF8F5;
            --bg-card: #FFFFFF;
            --text-main: #2C2C2A;
            --text-muted: #787672;
            --accent: #2563EB;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }
        header { background: var(--bg-card); padding: 12px 20px; border-bottom: 1px solid #e5e5e0; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 18px; font-weight: 700; }
        #map { flex-grow: 1; width: 100%; background: #e0e0e0; }
    </style>
</head>
<body>
    <header>
        <h1>✈️ Де летить — Радар</h1>
    </header>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Ініціалізація карти (центр України)
        var map = L.map('map').setView([48.3794, 31.1656], 6);

        // Додавання шару карти OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Виправлення багу з сірим екраном при завантаженні
        setTimeout(function() { map.invalidateSize(); }, 200);
    </script>
</body>
</html>
